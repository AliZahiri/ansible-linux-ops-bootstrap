timezone: UTC

ops_user: ops
ops_groups:
  - sudo

# Enable only after the operations user's public key has been provisioned.
# The role refuses to disable password authentication when authorized_keys is
# missing or empty, which keeps the default bootstrap path lockout-safe.
ssh_hardening_enabled: false
ssh_allowed_users:
  - "{{ ops_user }}"
ssh_password_authentication: "no"
ssh_service_name: ssh
ssh_authorized_keys_path: "/home/{{ ops_user }}/.ssh/authorized_keys"

base_packages:
  - ca-certificates
  - curl
  - gnupg
  - htop
  - jq
  - rsync
  - unattended-upgrades
  - ufw
  - vim

firewall_allowed_tcp_ports:
  - 22
  - 80
  - 443
  - 9100

docker_packages:
  - docker.io
  - docker-compose-plugin

node_exporter_version: "1.8.2"
node_exporter_user: node_exporter
node_exporter_port: 9100

backup_dir: /opt/backups
backup_retention_days: 7
backup_restore_verify_enabled: false
backup_restore_verify_query: "select 1"
